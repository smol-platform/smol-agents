# claude-code harness -> z.ai Anthropic endpoint, with durable AgentFS (kopia -> minio).
# EffectiveWorkingDir binds the CLI CWD to the AgentFS mount so file writes persist.
# Backs fs-roundtrip, fs-kill-survive, and (on AWS metal) the kata isolation cases.
apiVersion: runtime.agents.smol-agents.ai/v1
kind: Agent
metadata: { name: bench-claude-fs }
spec:
  mode: harness
  instructions: "You are a coding agent. Follow the instruction exactly and write files where asked."
  budget: { maxSteps: 1, maxTokens: 100000, maxWallClockSeconds: 600, maxToolCalls: 32 }
  storage:
    kind: agentfs
    agentfs:
      mountPath: /var/agentfs
      backend: kopia
      backup:
        s3:
          bucket: agentfs
          endpointURL: http://minio.hermes-e2e.svc.cluster.local:9000
          credentialsRef: { secretName: minio-creds }
  harness:
    kind: claude-code
    env:
      - { name: ANTHROPIC_BASE_URL, value: "https://api.z.ai/api/anthropic" }
      - { name: ANTHROPIC_MODEL, value: glm-4.6 }
      - { name: ANTHROPIC_AUTH_TOKEN, secretRef: { secretName: zai-anthropic } }
