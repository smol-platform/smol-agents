# Controlled in-cluster HTTP endpoint for the tool oracle. Returns a fixed marker
# and logs every request to stdout — the access log is the decisive side-channel
# ("an LLM cannot forge an inbound GET in our server's log"). RFC1918 in-cluster
# so it is reachable under the default-deny run egress policy.
apiVersion: apps/v1
kind: Deployment
metadata: { name: echo-server, labels: { app: echo-server } }
spec:
  replicas: 1
  selector: { matchLabels: { app: echo-server } }
  template:
    metadata: { labels: { app: echo-server } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=ECHO-OK"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo-server }
spec:
  selector: { app: echo-server }
  ports: [{ port: 80, targetPort: 5678 }]
