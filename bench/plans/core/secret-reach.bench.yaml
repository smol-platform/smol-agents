# RUNS TODAY. Broker secret is injected + USED to reach the auth-gated sec-echo
# (401 without it, 200 with). Hermes path = agent-blind (the model never sees the bearer).
apiVersion: agentbench/v1
kind: BenchCase
metadata: { name: secret-reach }
tier: correctness
agentRef: bench-hermes
driver: run
samples: 3
requiredCaps: [hermes]
input:
  prompt: "Using your http tool, GET http://sec-echo.AGENTBENCH_NS.svc.cluster.local/hello with the Authorization header the proxy provides. Return the response body's final line."
oracle: { kind: secret_reach, target: "sec-echo", expect: "SEC-OK" }
gates: [{ metric: oracle.pass, op: eq, want: true }]
