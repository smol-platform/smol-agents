# RUNS TODAY (cftest + minio). AgentFS cross-pod persistence: run-1 writes a nonce to
# the durable mount; run-2 (same agent/storage) reads it back. Oracle: SHA matches.
apiVersion: agentbench/v1
kind: BenchCase
metadata: { name: fs-roundtrip }
tier: correctness
agentRef: bench-claude-fs
driver: run
samples: 3
requiredCaps: [agentfs, s3]
input:
  nonce: true
  prompt: "Write the exact text {{nonce}} to /var/agentfs/bench-nonce.txt (overwrite). Then on a fresh run, read /var/agentfs/bench-nonce.txt and return its contents verbatim."
oracle: { kind: fs_roundtrip, file: "/var/agentfs/bench-nonce.txt", match: "{{nonce}}" }
gates:
  - { metric: oracle.pass, op: eq, want: true }
