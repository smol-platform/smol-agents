# Qdrant — SPIFFE-mTLS variant (x9i.2). Apply this INSTEAD of qdrant.yaml when
# you want identity-gated access to the vector store (multi-tenant / D1).
#
# Topology (a ghostunnel SPIFFE sidecar fronts Qdrant; Qdrant never speaks the
# wire directly):
#
#   memory-worker ──mTLS(7443)──▶ ghostunnel ──plaintext(127.0.0.1:6334)──▶ qdrant
#     QdrantConfig.TLS =                  server, SPIFFE Workload-API certs,
#     MTLSClientConfig(authorize qdrant)  --allow-uri-san = memory-worker SVID
#
# - Qdrant's own gRPC(6334)/REST(6333) stay pod-local; the NetworkPolicy permits
#   ONLY the ghostunnel mTLS port (7443) from memory-worker, so the only door is
#   the mutually-authenticated one. Probes stay httpGet on 6333 (kubelet, node-
#   local — not subject to the pod ingress policy).
# - Point the worker at this (collection "memory", dims via -backend-dims):
#     -backend=qdrant
#     -backend-endpoint=qdrant-mtls.smol-agents-system.svc:7443
#     -backend-mtls-spiffe-id=spiffe://smol-agents.ai/ns/smol-agents-system/sa/qdrant
#
#   kubectl apply -f deploy/qdrant/qdrant-mtls-sidecar.yaml
#
# ── VERIFICATION STATUS ──────────────────────────────────────────────────────
#   VERIFIED (x9i.6, live on gtr — real SPIRE + Cilium + Qdrant, 2026-06-19):
#              the full mTLS handshake — an authorized memory-worker SVID reaches
#              Qdrant /healthz (HTTP 200); a pod with the memory-worker LABEL but a
#              different SVID (SA=default) is REJECTED at the mTLS layer (past the
#              NetworkPolicy). The ghostunnel SPIFFE flags below are confirmed on
#              the pinned image. Two corrections folded in from that run:
#              (a) the SVID is /ns/<ns>/sa/<sa> (the SPIRE chart default CSID) — the
#                  /sa/ segment is required in --allow-uri-san + -backend-mtls-spiffe-id;
#              (b) the agent socket is spire-agent.sock; and Qdrant needs a writable
#                  snapshots path (QDRANT__STORAGE__SNAPSHOTS_PATH, below).
# ─────────────────────────────────────────────────────────────────────────────
---
# Dedicated SA so the pod's SVID is /ns/<ns>/sa/qdrant (the worker authorizes this
# exact id). Without it the pod runs as "default" and the id never matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: smol-agents-system
  labels: { app.kubernetes.io/name: qdrant }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant
  namespace: smol-agents-system
  labels: { app.kubernetes.io/name: qdrant }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: smol-agents-system
  labels: { app.kubernetes.io/name: qdrant }
spec:
  replicas: 1
  strategy: { type: Recreate } # single RWO PVC
  selector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: qdrant }
    spec:
      serviceAccountName: qdrant
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          env:
            # Snapshots default to /qdrant/snapshots — outside the storage mount and
            # not writable by the non-root user, so Qdrant crashes at startup
            # ("Can't create Snapshots directory: PermissionDenied", exit 101).
            # Redirect them under the storage PVC so they are writable + persist.
            - { name: QDRANT__STORAGE__SNAPSHOTS_PATH, value: /qdrant/storage/snapshots }
          ports:
            - { name: rest, containerPort: 6333 } # pod-local: probes + ghostunnel only
            - { name: grpc, containerPort: 6334 } # pod-local: ghostunnel target only
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 6333 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
        # SPIFFE-mTLS terminator: only authenticated peers (memory-worker SVID)
        # reach Qdrant; certs + trust bundle come from the SPIRE Workload API.
        - name: ghostunnel
          image: ghostunnel/ghostunnel:v1.8.2
          args:
            - server
            - --listen=0.0.0.0:7443
            - --target=127.0.0.1:6334
            - --use-workload-api-addr=unix:///run/spire/agent-sockets/spire-agent.sock
            # The SVID is /ns/<ns>/sa/<sa> (the SPIRE chart's default ClusterSPIFFEID);
            # the /sa/ segment is required — .../memory-worker would never match.
            - --allow-uri-san=spiffe://smol-agents.ai/ns/smol-agents-system/sa/memory-worker
          ports:
            - { name: mtls, containerPort: 7443 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: sockets, mountPath: /run/spire/agent-sockets, readOnly: true }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: qdrant }
        - name: sockets
          hostPath: { path: /run/spire/agent-sockets, type: DirectoryOrCreate }
---
# Only the ghostunnel mTLS port is exposed as a Service. The worker dials this.
apiVersion: v1
kind: Service
metadata:
  name: qdrant-mtls
  namespace: smol-agents-system
  labels: { app.kubernetes.io/name: qdrant }
spec:
  selector: { app.kubernetes.io/name: qdrant }
  ports:
    - { name: mtls, port: 7443, targetPort: 7443 }
---
# Permit ONLY the ghostunnel mTLS port (7443) from memory-worker. Direct 6333/
# 6334 ingress from any other pod is denied — the only door is the mTLS one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-mtls-ingress
  namespace: smol-agents-system
  labels: { app.kubernetes.io/name: qdrant }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { app.kubernetes.io/name: memory-worker }
      ports:
        - { protocol: TCP, port: 7443 }
