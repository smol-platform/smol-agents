{{- if .Values.sandbox.installRuntimeClass -}}
{{- /*
  Renders a RuntimeClass for the sandbox the chart targets. Most
  clusters install RuntimeClasses through kata-deploy / GKE Sandbox /
  Sandboxed Containers Operator and don't need this — controlled by
  `sandbox.installRuntimeClass`. R-SBX-1.
*/ -}}
{{- $rc := .Values.sandbox.runtimeClass -}}
{{- $handler := $rc -}}
{{- if eq $rc "gvisor" -}}{{- $handler = "runsc" -}}{{- end -}}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $rc }}
handler: {{ $handler }}
{{- end -}}
