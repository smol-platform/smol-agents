{{- if .Values.ebpfLoader.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smol-agents.fullname" . }}-ebpf-loader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: ebpf-loader
---
# The loader does not need to call the Kubernetes API; we keep the
# ServiceAccount empty (no Role/RoleBinding) by default. A Role with
# get/watch on Nodes can be opted into via .Values.ebpfLoader.rbac.expose.
{{- if .Values.ebpfLoader.rbac.expose }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "smol-agents.fullname" . }}-ebpf-loader
  labels:
    {{- include "smol-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "smol-agents.fullname" . }}-ebpf-loader
  labels:
    {{- include "smol-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "smol-agents.fullname" . }}-ebpf-loader
subjects:
  - kind: ServiceAccount
    name: {{ include "smol-agents.fullname" . }}-ebpf-loader
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}
