{{- include "smol-agents.validateSandbox" . -}}
{{- if eq .Values.mode "knative" -}}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "smol-agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smol-agents.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "smol-agents.selectorLabels" . | nindent 8 }}
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | quote }}
    spec:
      runtimeClassName: {{ .Values.sandbox.runtimeClass }}     # R-SBX-1
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          args: ["--config=/etc/smol-agents/agent.yaml"]
          ports:
            - name: http1
              containerPort: 8080
            - name: private-mtls
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: spire-agent-socket
              mountPath: {{ dir .Values.spire.workloadAPISocket }}
              readOnly: true
            - name: secret-broker
              mountPath: /run/secret-broker
            - name: config
              mountPath: /etc/smol-agents
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: secret-proxy
          image: "{{ .Values.secretProxy.image.repository }}:{{ .Values.secretProxy.image.tag }}"
          args: ["--config=/etc/secret-proxy/config.yaml"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.secretProxy.resources | nindent 12 }}
          volumeMounts:
            - name: spire-agent-socket
              mountPath: {{ dir .Values.spire.workloadAPISocket }}
              readOnly: true
            - name: secret-broker
              mountPath: /run/secret-broker
            - name: config
              mountPath: /etc/secret-proxy
              readOnly: true
      volumes:
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: secret-broker
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "smol-agents.fullname" . }}-config
        - name: tmp
          emptyDir: {}
{{- end -}}
