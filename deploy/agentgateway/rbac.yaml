# RBAC for the agentgateway: a read-only view of AgentSessions cluster-wide, so it
# can resolve per-session input caps + turn-stream retention (M2.20). The gateway
# fronts sessions in any namespace, so the grant is a ClusterRole; it is strictly
# read-only (get/list/watch) and touches no other resource. Without this binding
# the gateway falls back to the default input cap (it never fails closed on a
# missing read — turns still flow).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway
  namespace: smol-agents-system
  labels:
    app.kubernetes.io/name: smol-agents
    app.kubernetes.io/component: agentgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smol-agents-agentgateway
rules:
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [agentsessions]
    verbs: [get, list, watch]
  # CloudEvents team intake (t0d / rv3.1): read the addressed AgentTeam and
  # create the per-event coordinator AgentRun. Create-only on runs (the gateway
  # never reads/mutates existing runs); the run is then governed by admission +
  # the operator exactly like any other AgentRun.
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [agentteams]
    verbs: [get]
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [agentruns]
    verbs: [create]
  # General CloudEvents intake (h0d): list EventBindings to filter-route an event
  # to its targets in the namespace.
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [eventbindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smol-agents-agentgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smol-agents-agentgateway
subjects:
  - kind: ServiceAccount
    name: agentgateway
    namespace: smol-agents-system
