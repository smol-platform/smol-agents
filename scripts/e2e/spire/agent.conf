# Minimal SPIRE agent config — joins the server via a static
# join_token written by the L0 driver before bringing up the agent.

agent {
    data_dir = "/tmp/spire"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/agent-sockets/api.sock"
    trust_domain = "smol-agents.ai"
    join_token = "${JOIN_TOKEN}"
    insecure_bootstrap = true
}

plugins {
    KeyManager "memory" {
        plugin_data = {}
    }
    NodeAttestor "join_token" {
        plugin_data = {}
    }
    WorkloadAttestor "unix" {
        plugin_data = {}
    }
}
