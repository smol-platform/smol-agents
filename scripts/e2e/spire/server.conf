# Minimal SPIRE server config for the L0 ring.
# Trust domain: smol-agents.ai (matches the rest of the project).
# Storage: in-container SQLite under /tmp/spire — wiped on stack down.

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "smol-agents.ai"
    data_dir = "/tmp/spire"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/tmp/spire/datastore.sqlite3"
        }
    }
    KeyManager "memory" {
        plugin_data = {}
    }
    NodeAttestor "join_token" {
        plugin_data = {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}
