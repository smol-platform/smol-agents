# Cluster Autoscaler variant. CAS scales an external cloud ASG, so the
# operator cannot create the node group — instead it emits the node-group spec
# (CAS discovery tags + the kata launch-template userData) as a ConfigMap at
# smol-agents-system/anp-<name>-clusterautoscaler for your IaC to apply to a
# matching ASG. The in-cluster workload coupling (pool label + isolation taint)
# is identical to the Karpenter pool. See docs/runbooks/agent-node-pools.md.
apiVersion: agents.stigen.ai/v1
kind: AgentNodePool
metadata:
  name: kata-arm64-cas
spec:
  isolation: kata-fc
  provider: ClusterAutoscaler
  arch: arm64
  instanceFamilies: [c7gd, c6gd, m7gd] # metal families with local NVMe
  capacityType: [on-demand]
  minNodes: 0
  bootstrap:
    mode: PrebakedAMI # kata baked into the ASG launch-template AMI
    amiSelector:
      - tags: { kata-ready: "true" }
  thinPool:
    backing: instance-store
    dataSize: 50Gi
    metaSize: 5Gi
