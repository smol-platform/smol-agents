# OpenAI Codex agent — ephemeral, no persistent storage.
---
apiVersion: runtime.agents.stigen.ai/v1
kind: Agent
metadata:
  name: codex-helper
  namespace: tenant-a
spec:
  mode: harness
  instructions: "Help the user write code. Be concise."
  budget:
    maxSteps: 1
    maxTokens: 100000
    maxWallClockSeconds: 600
    maxToolCalls: 0
  harness:
    kind: codex
    image: knative-agents/codex:0.1.0
    sessionPolicy: ephemeral
    env:
      - name: OPENAI_API_KEY
        secretRef:
          secretName: openai-prod
