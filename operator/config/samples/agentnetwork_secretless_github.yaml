# Secretless egress to GitHub.
#
# The agent calls https://api.github.com through the identity-aware sidecar.
# For the `github` resource the sidecar:
#   1. mints an internal Txn-Token (RFC 8693) via the TTS, scoped to
#      `github:repo:read` and audienced at this trust domain — never sent
#      upstream;
#   2. hands that TraT to the secret broker, which verifies it (signature,
#      audience, expiry, and that req_wl == the agent's attested SPIFFE id)
#      and mints a short-lived GitHub App installation token scoped to the
#      requested repo;
#   3. injects the token as `Authorization: Bearer <token>`.
# The agent never sees the token, and eBPF drops any egress that isn't on the
# allow-list — so the credential cannot be exfiltrated to another host.
apiVersion: runtime.agents.stigen.ai/v1
kind: AgentNetwork
metadata:
  name: github-secretless
  namespace: tenant-a
spec:
  kind: identityProxy
  agentSelector:
    app.kubernetes.io/name: smol-agents
  identityProxy:
    # TTS mints (and the broker verifies) the Transaction Tokens. jwksUrl is
    # required because a credential resource is present (the broker must
    # verify the TraT before minting).
    tts:
      url: https://tts.security.svc/token
      subjectTokenType: urn:ietf:params:oauth:token-type:jwt
      subjectAudience: spiffe://stigen.ai/ns/security/sa/tts
      jwksUrl: https://tts.security.svc/jwks
    resources:
      - name: github
        kind: http
        localPort: 9200
        gateway: https://api.github.com/
        # Identity the sidecar presents to the broker UDS (SO_PEERCRED).
        jwtAudience: spiffe://stigen.ai/ns/tenant-a/sa/agent
        credential:
          name: github                  # broker credential/policy key
          scope: github:repo:read       # transaction intent of the authorizing TraT
          # header/scheme default to Authorization / Bearer (shown for clarity)
          header: Authorization
          scheme: Bearer
    egress:
      enforcement: ebpfBoth
      redirectCIDRs:
        - 0.0.0.0/0
      allow:
        # api.github.com only — everything else is dropped by eBPF.
        - cidr: 140.82.112.0/20
          protocol: tcp
          ports: [443]
