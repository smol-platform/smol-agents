# Full agent CR exercising every feature flag.
apiVersion: agents.stigen.ai/v1
kind: SmolAgent
metadata:
  name: full
  namespace: tenant-a
spec:
  trustDomain: stigen.ai
  mode: strict
  deploymentKind: knative
  replicas: 1
  features:
    identity:
      enabled: true
      mode: strict
      workloadAPI: unix:///run/spire/agent-sockets/api.sock
      bootTimeoutSeconds: 30
    transport:
      private:
        enabled: true
        addr: "0.0.0.0:8443"
        authorize:
          - "prefix:spiffe://stigen.ai/ns/tenant-a"
      public:
        enabled: false
    secrets:
      enabled: true
      brokerSocket: /run/secret-broker/secret-broker.sock
      maxLeaseTTLSeconds: 900
    sandbox:
      enabled: true
      runtimeClass: kata-fc
      allowHostEscape: false
    ebpf:
      enabled: true
      programs: [syscalls, network]
    knative:
      enabled: true
      scaleToZero: true
      minScale: 0
      maxScale: 50
    observability:
      enabled: true
      otlpEndpoint: otel-collector.observability.svc:4317
      serviceName: full-agent
