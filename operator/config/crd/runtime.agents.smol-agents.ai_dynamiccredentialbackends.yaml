apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamiccredentialbackends.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: DynamicCredentialBackend
    plural: dynamiccredentialbackends
    singular: dynamiccredentialbackend
    shortNames: [dcb]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Credential, type: string, jsonPath: .spec.credentialName }
        - { name: Provider, type: string, jsonPath: .spec.provider }
        - { name: Grants, type: integer, jsonPath: .status.grantCount }
        - { name: Ready, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            DynamicCredentialBackend is platform-owned infrastructure (D8) that
            mints short-lived, request-scoped provider credentials from a
            broker-only root secret the agent never sees. Recommend a
            RBAC-locked platform-secrets namespace. See
            docs/specs/dynamic-credential-backends.md.
          required: [spec]
          properties:
            spec:
              type: object
              required: [credentialName, provider]
              properties:
                credentialName: { type: string, minLength: 1, description: 'MUST match AgentNetwork resources[].credential.name.' }
                provider: { type: string, enum: [githubApp], description: 'Backend implementation (only githubApp today).' }
                maxLeaseTTL: { type: string, description: 'Caps minted lease lifetime (e.g. 5m); capped to the broker hard max (15m).' }
                githubApp:
                  type: object
                  description: GitHub App installation-token backend; required when provider=githubApp.
                  required: [appID, privateKeyRef]
                  properties:
                    appID: { type: string, minLength: 1 }
                    baseURL: { type: string, description: 'GHES API base override; default https://api.github.com.' }
                    privateKeyRef:
                      type: object
                      description: 'The ROOT secret (App private key) — mounted into the SPIRE-backed broker only, never the agent.'
                      required: [secretName]
                      properties:
                        secretName: { type: string, minLength: 1 }
                        key: { type: string }
                    scopePermissions:
                      type: object
                      description: 'Maps a TraT scope (e.g. github:repo:read) to installation-token permissions (e.g. {contents: read}).'
                      additionalProperties:
                        type: object
                        additionalProperties: { type: string }
                grants:
                  type: array
                  description: Per-Agent authorization to mint a scope.
                  items:
                    type: object
                    required: [principal, scope]
                    properties:
                      principal: { type: string, description: 'Agent SPIFFE ID (spiffe://<trust-domain>/<path>).' }
                      scope: { type: string, minLength: 1, description: 'A key of githubApp.scopePermissions.' }
                      repos: { type: array, items: { type: string }, description: 'rctx.repo allow-list; empty = any repo the App can reach.' }
            status:
              type: object
              description: Observed backend state.
              properties:
                phase: { type: string, description: 'Ready | Pending | Failed.' }
                observedGeneration: { type: integer }
                grantCount: { type: integer, description: 'Number of authorized grants.' }
                reason: { type: string }
                message: { type: string }
