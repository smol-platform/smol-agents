apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentpolicies.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: AgentPolicy
    plural: agentpolicies
    singular: agentpolicy
    shortNames: [apol]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            AgentPolicy is a namespace-scoped guardrail (allow-lists + budget
            cap + output redaction). Composed across all policies in the
            namespace and ENFORCED at admission (the Agent/AgentRun validating
            webhook), at reconcile (a backstop that flips a violating Agent to
            Failed/PolicyViolation), and on the fold (Output/Steps redaction).
          required: [spec]
          properties:
            spec:
              type: object
              description: AgentPolicySpec declares the namespace guardrails (enforced — see the CRD description).
              properties:
                allowedProviders:
                  type: array
                  description: ModelProvider allow-list for agents in this namespace (enforced via the AgentPolicy webhook + reconcile gate).
                  items: { type: string }
                allowedTools:
                  type: array
                  description: Tool allow-list for agents in this namespace (enforced via the AgentPolicy webhook + reconcile gate).
                  items: { type: string }
                maxBudget:
                  type: object
                  description: Per-run budget ceiling (enforced via the AgentPolicy webhook + reconcile gate).
                  properties:
                    maxSteps: { type: integer, minimum: 1, description: 'Ceiling on plan-act-observe steps per run.' }
                    maxTokens: { type: integer, minimum: 1, description: 'Ceiling on total LLM tokens per run.' }
                    maxWallClockSeconds: { type: integer, minimum: 1, description: 'Ceiling on run wall-clock duration in seconds.' }
                    maxToolCalls: { type: integer, minimum: 0, description: 'Ceiling on total tool invocations per run.' }
                redaction:
                  type: object
                  description: Output/Steps redaction policy (applied on the run-result fold).
                  properties:
                    patterns:
                      type: array
                      description: Regular expressions masked from Output/Steps (applied on the run-result fold).
                      items: { type: string }
