apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: smolagentplatforms.agents.smol-agents.ai
spec:
  group: agents.smol-agents.ai
  scope: Cluster
  names:
    kind: SmolAgentPlatform
    plural: smolagentplatforms
    singular: smolagentplatform
    shortNames:
      - knap
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: TrustDomain
          type: string
          jsonPath: .spec.defaultTrustDomain
        - name: Loader
          type: string
          jsonPath: .spec.ebpfLoader.preset
        - name: Canary
          type: integer
          jsonPath: .spec.canary.percent
        - name: Tenants
          type: integer
          jsonPath: .status.managedTenants
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            SmolAgentPlatform is the cluster-scoped platform CR carrying
            cluster-wide defaults, the feature allow/deny matrix, the
            ebpf-loader DaemonSet config, and node-provisioning inputs. Exactly
            one Platform CR is permitted per cluster (enforced by the validating
            webhook, R-OP-API-2).
          required: [spec]
          properties:
            spec:
              type: object
              description: SmolAgentPlatformSpec carries cluster-wide defaults and the feature allow/deny matrix.
              required: [defaultTrustDomain]
              properties:
                defaultTrustDomain:
                  type: string
                  description: Used by tenant CRs that omit spec.trustDomain.
                  minLength: 1
                defaults:
                  type: object
                  description: |-
                    Default Features inherited by tenant SmolAgents; merge
                    precedence explicit > platform default > compiled-in. NOTE:
                    the mutating webhook currently merges only scalar defaults,
                    not the nested Features tree.
                  x-kubernetes-preserve-unknown-fields: true
                featurePolicy:
                  type: array
                  description: Per-feature allow/deny matrix consulted by the validating webhook; tenants enabling a feature with allowed=false are rejected.
                  items:
                    type: object
                    required: [feature]
                    properties:
                      feature: { type: string, minLength: 1, description: 'Feature constant this row governs.' }
                      allowed: { type: boolean, default: true, description: 'Whether tenants may enable this feature at all.' }
                      defaultEnabled: { type: boolean, default: true, description: 'Default enabled value when a tenant CR omits the feature.' }
                ebpfLoader:
                  type: object
                  description: Per-cluster ebpf-loader DaemonSet configuration (mirrors the chart's ebpfLoader values).
                  properties:
                    enabled: { type: boolean, default: true, description: 'Whether the ebpf-loader DaemonSet is deployed.' }
                    preset:
                      type: string
                      description: Platform preset selecting loader defaults for the host OS/distro.
                      enum: [generic, gke-cos, eks-bottlerocket, aks-mariner, k3s, openshift, talos]
                      default: generic
                    image: { type: string, description: 'ebpf-loader image override; empty uses the operator default.' }
                    pinRoot: { type: string, default: /sys/fs/bpf/smol-agents, description: 'bpffs pin directory for loaded programs/maps.' }
                    capabilityMode:
                      type: string
                      description: 'Loader privilege level: privileged or minimal (drop to the least caps the host allows).'
                      enum: [privileged, minimal]
                      default: privileged
                canary:
                  type: object
                  description: Canary rollout configuration. UNIMPLEMENTED in v0.2.0 — never read by the reconciler.
                  properties:
                    percent:
                      type: integer
                      description: Percentage of tenant CRs that pick up new non-Immediate rollouts. UNIMPLEMENTED in v0.2.0 — never read by the reconciler.
                      minimum: 0
                      maximum: 100
                      default: 0
                nodeProvisioning:
                  type: object
                  description: |-
                    Cluster-level inputs AgentNodePool needs to compile to
                    Karpenter: subnet/SG discovery, the node IAM role, and the
                    existing node-join image/userData the kata layer composes
                    onto. R-PROV-1. See docs/design/agent-platform.md.
                  properties:
                    amiFamily: { type: string, default: Custom, description: 'AMIFamily for generated EC2NodeClasses. "Custom" on k0s (we own all userData).' }
                    role: { type: string, description: 'Node IAM role name set on generated EC2NodeClasses.' }
                    subnetSelectorTags:
                      type: object
                      description: Tags driving Karpenter's subnet discovery.
                      additionalProperties: { type: string }
                    securityGroupSelectorTags:
                      type: object
                      description: Tags driving Karpenter's security-group discovery.
                      additionalProperties: { type: string }
                    baseAMISelector:
                      type: array
                      description: Existing join-capable image used for the AgentNodePool UserData bootstrap mode (kata appended at boot).
                      items:
                        type: object
                        description: Mirrors a Karpenter EC2NodeClass amiSelectorTerm.
                        properties:
                          tags:
                            type: object
                            description: Tag selector for the AMI.
                            additionalProperties: { type: string }
                          id: { type: string, description: 'Explicit AMI ID.' }
                          alias: { type: string, description: 'AMI alias (e.g. a family/version alias).' }
                    joinUserData: { type: string, description: 'The existing deployment''s node-join snippet (k0s worker-join + providerID) the kata layer is appended to.' }
                    allowGvisorFallback: { type: boolean, description: 'Lets a kata agent fall back to gVisor when no kata AgentNodePool exists; when false such an agent is held NotReady with reason NoKVMCapacity. R-PROV-2.' }
            status:
              type: object
              description: SmolAgentPlatformStatus reports operator health at cluster scope.
              properties:
                observedGeneration: { type: integer, description: 'The last generation the operator reconciled.' }
                managedTenants: { type: integer, description: 'Count of tenant SmolAgents currently managed.' }
                conditions:
                  type: array
                  description: Cluster-scope operator health conditions.
                  items:
                    type: object
                    properties:
                      type: { type: string, description: 'Condition type.' }
                      status: { type: string, enum: ["True", "False", "Unknown"], description: 'Condition status.' }
                      reason: { type: string, description: 'Machine-readable reason for the condition.' }
                      message: { type: string, description: 'Human-readable detail for the condition.' }
                      lastTransitionTime: { type: string, format: date-time, description: 'When the condition last changed.' }
                      observedGeneration: { type: integer, description: 'Generation observed when the condition was set.' }
