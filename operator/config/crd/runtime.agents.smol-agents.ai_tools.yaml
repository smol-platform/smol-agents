apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tools.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: Tool
    plural: tools
    singular: tool
    shortNames: [atool]
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            Tool is a namespaced, reusable capability an agent can invoke,
            described by its transport (kind) and JSON Schemas. Agents reference
            Tools by name in spec.tools.
          required: [spec]
          properties:
            spec:
              type: object
              description: ToolSpec describes one tool's transport and I/O schemas.
              required: [kind, inputSchema, outputSchema]
              properties:
                kind:
                  type: string
                  description: |-
                    Tool transport: mcp (external MCP server) | http (HTTP+JSON)
                    | agent (agent-to-agent, RESERVED, no invoker) | function
                    (in-process, TEST-ONLY). WARNING: as of v0.2.0 loop-mode
                    agents do NOT invoke tools (specs never reach the pod;
                    executor invoker map empty); only harness-mode agents act on
                    tools via embedded logic. See
                    docs/design/tool-kinds-roadmap.md.
                  enum: [mcp, http, agent, function]
                description: { type: string, description: 'Human-readable description of what the tool does (surfaced to the model).' }
                inputSchema:
                  type: object
                  description: JSON Schema (2020-12) for the tool's arguments; calls are validated before dispatch.
                  x-kubernetes-preserve-unknown-fields: true
                outputSchema:
                  type: object
                  description: JSON Schema (2020-12) for the tool's result; calls are validated before dispatch.
                  x-kubernetes-preserve-unknown-fields: true
                mcp:
                  type: object
                  description: MCP transport settings; applies when kind=mcp.
                  properties:
                    url: { type: string, description: 'Base URL of the external MCP server.' }
                    auth:
                      type: object
                      description: Credential leased by the broker for the MCP connection.
                      properties:
                        secretName: { type: string, description: 'Name of the Secret holding the credential.' }
                http:
                  type: object
                  description: HTTP+JSON transport settings; applies when kind=http.
                  properties:
                    url: { type: string, description: 'Endpoint the tool call is sent to.' }
                    method: { type: string, description: 'HTTP method; defaults to POST.' }
                    headers:
                      type: object
                      description: Static request headers.
                      additionalProperties: { type: string }
                    auth:
                      type: object
                      description: Credential leased by the broker for the HTTP call.
                      properties:
                        secretName: { type: string, description: 'Name of the Secret holding the credential.' }
                agent:
                  type: object
                  description: 'Agent-to-agent (A2A) delegation target: an LLM tool call of kind=agent spawns a child AgentRun for the callee in the SAME namespace (M3).'
                  properties:
                    ref:
                      type: object
                      description: Reference to the callee Agent.
                      properties:
                        name: { type: string, description: 'Name of the target Agent.' }
                        namespace: { type: string, description: 'Namespace of the target Agent; defaults to this Tool''s namespace.' }
                    maxTokens: { type: integer, format: int64, minimum: 0, description: 'Token budget cap for the child run; the effective child budget is min(this, parent-remaining). 0 = parent-remaining (M3.5).' }
                    timeoutSeconds: { type: integer, minimum: 0, description: 'Per-call wall-clock cap on the child delegation; 0 = bounded only by the parent run deadline (M3.5).' }
                function:
                  type: object
                  description: In-process function target; TEST-ONLY.
                  properties:
                    name: { type: string, description: 'Registered function name.' }
