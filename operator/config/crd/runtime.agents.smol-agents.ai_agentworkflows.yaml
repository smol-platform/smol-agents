---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agentworkflows.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  names:
    kind: AgentWorkflow
    listKind: AgentWorkflowList
    plural: agentworkflows
    shortNames:
    - awf
    singular: agentworkflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          AgentWorkflow is a declarative, result-routed DAG of agent steps
          (LangGraph StateGraph): nodes name a same-namespace Agent, edges wire
          them, and conditional edges route on the prior node's output via an
          operator-evaluated, side-effect-free predicate (never an LLM).
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            required: [nodes]
            properties:
              paused:
                type: boolean
                description: 'Marks a dormant event TEMPLATE — the operator does not materialize its nodes; each event clones a fresh un-paused per-event instance that runs (mirrors CronJob.spec.suspend).'
              nodes:
                type: array
                description: The workflow steps (≥1); names are unique, START/END reserved.
                items:
                  type: object
                  required: [name, agentRef]
                  properties:
                    name: { type: string, description: 'Unique node handle (not START/END).' }
                    agentRef: { type: string, description: 'Agent this node runs — a bare name in this namespace.' }
                    input:
                      type: object
                      description: Static run input for the node.
                      x-kubernetes-preserve-unknown-fields: true
              edges:
                type: array
                description: Wire nodes (from -> to); an edge with `when` is conditional.
                items:
                  type: object
                  required: [from, to]
                  properties:
                    from: { type: string, description: 'Source node (or START).' }
                    to: { type: string, description: 'Target node (or END).' }
                    when: { type: string, description: 'Routing predicate over the from-node output (e.g. "score >= 80"); empty = unconditional. Evaluated operator-side; cannot read usage.' }
            type: object
          status:
            properties:
              phase: { type: string }
              reason: { type: string }
              message: { type: string }
              observedGeneration: { type: integer, format: int64 }
              cumulativeUsage:
                type: object
                properties:
                  steps: { type: integer }
                  tokens: { type: integer }
                  toolCalls: { type: integer }
                  wallClockUsed: { type: integer, format: int64 }
                  costUSDMilli: { type: integer, format: int64 }
              nodeStates:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    phase: { type: string }
                    runName: { type: string }
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
