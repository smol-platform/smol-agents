apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsessions.runtime.agents.stigen.ai
spec:
  group: runtime.agents.stigen.ai
  scope: Namespaced
  names:
    kind: AgentSession
    plural: agentsessions
    singular: agentsession
    shortNames: [asess]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [agentRef]
              properties:
                agentRef: { type: string, minLength: 1 }
            status:
              type: object
              properties:
                runs:
                  type: array
                  items: { type: string }
