---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: memorystores.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  names:
    kind: MemoryStore
    listKind: MemoryStoreList
    plural: memorystores
    shortNames:
    - mstore
    singular: memorystore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.driver
      name: Driver
      type: string
    - jsonPath: .spec.tenancy.model
      name: Tenancy
      type: string
    - jsonPath: .status.boundWorkers
      name: Workers
      type: integer
    - jsonPath: .status.phase
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          MemoryStore declares a memory backend (vector / graph / kv / eventlog /
          filesystem). The operator reconciles this into retrieval-worker infrastructure
          and wires backend credentials via the secret broker.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MemoryStoreSpec is the canonical CRD shape for a backend declaration.
              Implements R-MEM-API-1.
            properties:
              agentfs:
                description: |-
                  AgentFS configures the Turso AgentFS engine when kind=filesystem.
                  Reuses AgentFSSpec (sizeGiB, mountPath, image, backup, restore) verbatim.
                  Required when kind=filesystem, must be nil otherwise.
                properties:
                  backup:
                    description: Backup configures S3 backups + WAL snapshotting +
                      retention.
                    properties:
                      retention:
                        description: |-
                          Retention bounds the version count and minimum age before a
                          version becomes a candidate for deletion.
                        properties:
                          maxVersions:
                            default: 24
                            description: MaxVersions caps the number of stored full
                              snapshots.
                            format: int32
                            minimum: 1
                            type: integer
                          minAge:
                            description: MinAge is the minimum age of a version before
                              it can be deleted.
                            type: string
                        type: object
                      s3:
                        description: S3 is the destination. Versioning + SSE land
                          here.
                        properties:
                          bucket:
                            type: string
                          credentialsRef:
                            description: |-
                              CredentialsRef points at a broker secret with AWS-style
                              access-key-id + secret-access-key (and optional session-token).
                              When unset, the SDK's ambient credential chain is used.
                            properties:
                              secretName:
                                type: string
                            required:
                            - secretName
                            type: object
                          endpointURL:
                            description: |-
                              EndpointURL targets a non-AWS S3 service (e.g. minio, R2,
                              GCS-S3-compat).
                            type: string
                          kmsKeyARN:
                            description: KMSKeyARN is required when SSEAlgorithm=="aws:kms".
                            type: string
                          prefix:
                            description: Prefix groups multiple agents in one bucket.
                            type: string
                          region:
                            default: us-east-1
                            description: |-
                              Region is the AWS region. Required even for S3-compatible
                              services that ignore it (signed requests need a region label).
                            type: string
                          sseAlgorithm:
                            default: AES256
                            description: |-
                              SSEAlgorithm is one of "AES256" or "aws:kms". Empty disables
                              server-side encryption (not recommended).
                            enum:
                            - AES256
                            - aws:kms
                            type: string
                          versioning:
                            default: true
                            description: |-
                              Versioning expresses the operator's expectation that the target
                              bucket has S3 Versioning enabled. The backup driver verifies
                              at startup and refuses to operate on a bucket that lacks it
                              when Versioning==true (R-AFS-2).
                            type: boolean
                        required:
                        - bucket
                        type: object
                      schedule:
                        default: '@hourly'
                        description: Schedule is a cron expression for full backups.
                          Default is hourly.
                        type: string
                      walSnapshotInterval:
                        description: |-
                          WALSnapshotInterval is the cadence for incremental WAL frame
                          uploads between full backups. Default is 30s.
                        type: string
                    required:
                    - s3
                    type: object
                  image:
                    description: Image overrides the AgentFS sidecar image.
                    type: string
                  mountPath:
                    default: /var/agentfs
                    description: MountPath where the harness sees the AgentFS root.
                    type: string
                  restore:
                    description: |-
                      Restore configures bootstrap-from-S3 behaviour. When unset and a
                      Backup target exists, the runtime restores the latest version on
                      first start.
                    properties:
                      ifMissing:
                        default: fresh
                        description: IfMissing controls behaviour when no backup exists
                          in S3.
                        enum:
                        - fresh
                        - fail
                        type: string
                      mode:
                        default: latest
                        description: 'Mode: latest | versionID | pointInTime.'
                        enum:
                        - latest
                        - versionID
                        - pointInTime
                        type: string
                      pointInTime:
                        description: |-
                          PointInTime is an RFC3339 timestamp; the most recent version
                          older than this is selected. Consulted when Mode==pointInTime.
                        type: string
                      versionID:
                        description: VersionID is consulted when Mode==versionID.
                        type: string
                    type: object
                  sizeGiB:
                    description: SizeGiB is the requested PVC size for the AgentFS
                      mount.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - sizeGiB
                type: object
              auth:
                description: |-
                  Auth is a broker-resolved credential reference. Required for most
                  drivers; never a literal secret. For kind=filesystem the S3 creds
                  are declared in AgentFS.Backup.S3.CredentialsRef.
                properties:
                  secretName:
                    type: string
                required:
                - secretName
                type: object
              driver:
                description: Driver selects the concrete implementation within the
                  kind.
                enum:
                - pgvector
                - qdrant
                - neo4j
                - redis
                - agentfs
                type: string
              endpoint:
                description: |-
                  Endpoint is the backend service address (host:port or URL).
                  Not required for kind=filesystem (the AgentFS sidecar is co-located).
                type: string
              kind:
                description: Kind discriminates the backend modality.
                enum:
                - vector
                - graph
                - kv
                - eventlog
                - filesystem
                type: string
              tenancy:
                description: Tenancy declares the isolation model for this store.
                properties:
                  model:
                    description: |-
                      Model is required: "shared" (one backend, tenant label key isolates rows/vectors)
                      or "dedicated" (one backend per tenant).
                    enum:
                    - shared
                    - dedicated
                    type: string
                  tenantLabelKey:
                    description: |-
                      TenantLabelKey is the metadata key used to partition records when Model=shared.
                      Required when Model=shared.
                    type: string
                required:
                - model
                type: object
            required:
            - driver
            - kind
            - tenancy
            type: object
          status:
            description: MemoryStoreStatus is reported by the controller.
            properties:
              boundWorkers:
                description: BoundWorkers is the count of retrieval workers connected
                  to this store.
                format: int32
                type: integer
              conditions:
                description: Conditions follows the standard Kubernetes condition
                  pattern.
                items:
                  description: MemoryCondition is a standard Kubernetes condition
                    for memory resources.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is when this condition last
                        changed.
                      type: string
                    message:
                      description: Message is a human-readable elaboration.
                      type: string
                    reason:
                      description: Reason is a CamelCase machine-readable reason string.
                      type: string
                    status:
                      description: Status is "True", "False", or "Unknown".
                      type: string
                    type:
                      description: Type is the condition type (e.g. "Ready", "BackendReachable").
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable elaboration of Reason.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last acted on.
                format: int64
                type: integer
              phase:
                description: Phase is one of Pending, Ready, Degraded.
                type: string
              reason:
                description: Reason is a machine-readable summary of the current phase.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
