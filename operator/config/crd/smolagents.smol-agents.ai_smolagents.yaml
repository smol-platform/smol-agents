# Hand-rolled CRD for SmolAgent. controller-gen would normally
# generate this from kubebuilder markers; the schema below mirrors the
# Go types in operator/api/v1/.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: smolagents.agents.smol-agents.ai
spec:
  group: agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: SmolAgent
    plural: smolagents
    singular: smolagent
    shortNames:
      - kna
      - agent
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Identity
          type: string
          jsonPath: .status.features.identity.ready
        - name: MTLS
          type: string
          jsonPath: .status.features.transport\.private.ready
        - name: EBPF
          type: string
          jsonPath: .status.features.ebpf.ready
        - name: Secrets
          type: string
          jsonPath: .status.features.secrets.ready
        - name: RuntimeClass
          type: string
          jsonPath: .spec.features.sandbox.runtimeClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [trustDomain]
              properties:
                trustDomain:
                  type: string
                  minLength: 1
                mode:
                  type: string
                  enum: [insecure, permissive, strict]
                deploymentKind:
                  type: string
                  enum: [knative, deployment, statefulset]
                  default: knative
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                rollout:
                  type: object
                  properties:
                    paused:
                      type: boolean
                features:
                  type: object
                  properties:
                    identity:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        mode: { type: string, enum: [insecure, permissive, strict], default: strict }
                        workloadAPI: { type: string, default: "unix:///run/spire/agent-sockets/api.sock" }
                        bootTimeoutSeconds: { type: integer, minimum: 1, default: 30 }
                    transport:
                      type: object
                      properties:
                        private:
                          type: object
                          properties:
                            enabled: { type: boolean, default: true }
                            rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                            addr: { type: string, default: "0.0.0.0:8443" }
                            authorize: { type: array, items: { type: string } }
                        public:
                          type: object
                          properties:
                            enabled: { type: boolean, default: false }
                            rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                            addr: { type: string, default: "0.0.0.0:8444" }
                            certPath: { type: string }
                            keyPath: { type: string }
                    secrets:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        brokerSocket: { type: string, default: "/run/secret-broker/secret-broker.sock" }
                        maxLeaseTTLSeconds: { type: integer, minimum: 1, default: 900 }
                    sandbox:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        runtimeClass: { type: string, default: kata-fc }
                        allowHostEscape: { type: boolean, default: false }
                    ebpf:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        programs:
                          type: array
                          items: { type: string }
                          default: [syscalls, network]
                    knative:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        scaleToZero: { type: boolean, default: true }
                        minScale: { type: integer, minimum: 0, default: 0 }
                        maxScale: { type: integer, minimum: 1, default: 50 }
                    observability:
                      type: object
                      properties:
                        enabled: { type: boolean, default: true }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate }
                        otlpEndpoint: { type: string }
                        serviceName: { type: string, default: smol-agent }
            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                phase: { type: string, enum: [Pending, Reconciling, Ready, Failed] }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: [ "True", "False", "Unknown" ] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                      observedGeneration: { type: integer }
                features:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      ready: { type: boolean }
                      mode: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
