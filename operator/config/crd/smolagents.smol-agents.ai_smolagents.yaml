# Hand-rolled CRD for SmolAgent. controller-gen would normally
# generate this from kubebuilder markers; the schema below mirrors the
# Go types in operator/api/v1/.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: smolagents.agents.smol-agents.ai
spec:
  group: agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: SmolAgent
    plural: smolagents
    singular: smolagent
    shortNames:
      - kna
      - agent
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Identity
          type: string
          jsonPath: .status.features.identity.ready
        - name: MTLS
          type: string
          jsonPath: .status.features.transport\.private.ready
        - name: EBPF
          type: string
          jsonPath: .status.features.ebpf.ready
        - name: Secrets
          type: string
          jsonPath: .status.features.secrets.ready
        - name: RuntimeClass
          type: string
          jsonPath: .spec.features.sandbox.runtimeClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            SmolAgent is the namespaced top-level CR describing a tenant agent
            deployment: its trust domain, runtime image, deployment kind, and
            per-capability Features (identity, mTLS, secrets, sandbox, eBPF,
            Knative, observability). The operator reconciles it into the
            workload + supporting resources. Implements R-OP-API-1.
          required: [spec]
          properties:
            spec:
              type: object
              description: SmolAgentSpec is the desired state of a tenant agent.
              required: [trustDomain]
              properties:
                trustDomain:
                  type: string
                  description: MUST match the SPIRE deployment's trust domain.
                  minLength: 1
                mode:
                  type: string
                  description: |-
                    Legacy compatibility shorthand also accepted by the chart:
                    insecure | permissive | strict. If set it overrides
                    features.identity.mode.
                  enum: [insecure, permissive, strict]
                deploymentKind:
                  type: string
                  description: Selects how the agent runs.
                  enum: [knative, deployment, statefulset]
                  default: knative
                image:
                  type: string
                  description: |-
                    Fully-qualified OCI image; defaults to the hardened
                    distroless agent image which has no Node/shell — custom
                    daemon agents e.g. openclaw MUST supply their own image; see
                    docs/design/custom-agent-images.md.
                replicas:
                  type: integer
                  description: Applies to deployment / statefulset deployment kinds.
                  minimum: 1
                  default: 1
                resources:
                  type: object
                  description: 'Override the agent container compute requests/limits (M4.21); a heavier daemon (OpenClaw) needs more than the default.'
                  x-kubernetes-preserve-unknown-fields: true
                ports:
                  type: array
                  description: 'Extra in-pod container ports on the agent (M4.21), e.g. OpenClaw control:18789 (in-pod/mesh only).'
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                rollout:
                  type: object
                  description: Pauses or resumes operator-driven changes.
                  properties:
                    paused:
                      type: boolean
                      description: Freezes operator-driven changes; existing resources stay.
                features:
                  type: object
                  description: Per-capability feature configuration.
                  properties:
                    identity:
                      type: object
                      description: SPIFFE workload-identity feature (R-IDN-*); injects an SVID via the SPIRE workload API.
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles the feature; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        mode: { type: string, enum: [insecure, permissive, strict], default: strict, description: 'Identity enforcement: insecure | permissive | strict.' }
                        workloadAPI: { type: string, default: "unix:///run/spire/agent-sockets/api.sock", description: 'SPIRE workload API socket path.' }
                        bootTimeoutSeconds: { type: integer, minimum: 1, default: 30, description: 'How long the agent waits for an SVID before failing.' }
                    transport:
                      type: object
                      description: mTLS transport feature with private (in-mesh) and public (gateway-fronted) sub-features.
                      properties:
                        private:
                          type: object
                          description: In-mesh SPIFFE mTLS server.
                          properties:
                            enabled: { type: boolean, default: true, description: 'Toggles in-mesh mTLS; when false the operator removes its owned resources.' }
                            rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                            addr: { type: string, default: "0.0.0.0:8443", description: 'Listen address for the private mTLS server.' }
                            authorize: { type: array, items: { type: string }, description: 'SPIFFE authorizer descriptors (any:spiffe://td, prefix:spiffe://td/path, or a full SPIFFE ID); OR semantics across entries.' }
                        public:
                          type: object
                          description: Gateway-fronted public mTLS; default-disabled, opt-in.
                          properties:
                            enabled: { type: boolean, default: false, description: 'Toggles public mTLS; tenants must explicitly opt in.' }
                            rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                            addr: { type: string, default: "0.0.0.0:8444", description: 'Listen address for the public mTLS server.' }
                            certPath: { type: string, description: 'Path to the public server certificate.' }
                            keyPath: { type: string, description: 'Path to the public server private key.' }
                    secrets:
                      type: object
                      description: kloak-style secret-broker sidecar feature.
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles the broker sidecar; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        brokerSocket: { type: string, default: "/run/secret-broker/secret-broker.sock", description: 'Unix socket the agent uses to request leased credentials.' }
                        maxLeaseTTLSeconds: { type: integer, minimum: 1, default: 900, description: 'Maximum lease lifetime in seconds for brokered credentials.' }
                    sandbox:
                      type: object
                      description: Pod isolation feature controlling the RuntimeClass.
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles sandboxing; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        runtimeClass: { type: string, default: kata-fc, description: 'Default kata-fc microVM; runc requires features.sandbox.allowHostEscape=true, R-SBX-1 fail-closed; restricted PSA enforced and not overridable.' }
                        allowHostEscape: { type: boolean, default: false, description: 'Opt out of sandboxing (run on the host runtime); the validating webhook rejects this unless the Platform CR allows it. R-SBX-1.' }
                    ebpf:
                      type: object
                      description: Per-Pod eBPF program feature (the host-level loader is governed by the Platform CR).
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles eBPF programs; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        programs:
                          type: array
                          description: eBPF program list attached to the pod.
                          items: { type: string }
                          default: [syscalls, network]
                    knative:
                      type: object
                      description: Knative Serving exposure feature.
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles Knative exposure; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        scaleToZero: { type: boolean, default: true, description: 'Whether the Knative Service may scale to zero when idle.' }
                        minScale: { type: integer, minimum: 0, default: 0, description: 'Minimum number of replicas.' }
                        maxScale: { type: integer, minimum: 1, default: 50, description: 'Maximum number of replicas.' }
                    observability:
                      type: object
                      description: OpenTelemetry emission feature.
                      properties:
                        enabled: { type: boolean, default: true, description: 'Toggles OTel emission; when false the operator removes its owned resources.' }
                        rolloutPolicy: { type: string, enum: [Immediate, Canary, Manual], default: Immediate, description: 'Rollout policy: Immediate | Canary | Manual — Canary is NOT yet implemented.' }
                        otlpEndpoint: { type: string, description: 'OTLP collector endpoint; empty disables export.' }
                        serviceName: { type: string, default: smol-agent, description: 'service.name resource attribute on emitted telemetry.' }
            status:
              type: object
              description: SmolAgentStatus is the observed state. R-OP-FF-3.
              properties:
                observedGeneration: { type: integer, description: 'The last generation the operator reconciled.' }
                phase: { type: string, enum: [Pending, Reconciling, Ready, Failed], description: 'Aggregate lifecycle: Pending | Reconciling | Ready | Failed.' }
                conditions:
                  type: array
                  description: One entry per feature plus an aggregate at type=Ready.
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type: { type: string, description: 'Condition type (feature name, or Ready for the aggregate).' }
                      status: { type: string, enum: [ "True", "False", "Unknown" ], description: 'Condition status.' }
                      reason: { type: string, description: 'Machine-readable reason for the condition.' }
                      message: { type: string, description: 'Human-readable detail for the condition.' }
                      lastTransitionTime: { type: string, format: date-time, description: 'When the condition last changed.' }
                      observedGeneration: { type: integer, description: 'Generation observed when the condition was set.' }
                features:
                  type: object
                  description: Per-feature status, keyed by the feature constant (matches operator/pkg/features.Feature).
                  additionalProperties:
                    type: object
                    properties:
                      enabled: { type: boolean, description: 'Whether the feature is enabled.' }
                      ready: { type: boolean, description: 'Whether the feature reconciled successfully.' }
                      mode: { type: string, description: 'Effective mode for the feature, where applicable.' }
                      reason: { type: string, description: 'Machine-readable reason for the feature state.' }
                      message: { type: string, description: 'Human-readable detail for the feature state.' }
                      lastTransitionTime: { type: string, format: date-time, description: 'When the feature state last changed.' }
