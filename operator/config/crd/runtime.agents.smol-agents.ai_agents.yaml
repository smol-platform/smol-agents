apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: Agent
    plural: agents
    singular: agent
    shortNames: [ag]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Provider
          type: string
          jsonPath: .spec.model.providerRef
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [instructions, budget]
              properties:
                mode:
                  type: string
                  enum: [loop, harness]
                  default: loop
                model:
                  type: object
                  properties:
                    providerRef: { type: string }
                    name: { type: string }
                    temperature: { type: number }
                    topP: { type: number }
                    maxOutputTokens: { type: integer }
                harness:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [claude-code, codex, pi, aider, goose, generic-cli, generic-http, hermes]
                    image: { type: string }
                    version: { type: string }
                    command:
                      type: array
                      items: { type: string }
                    sessionPolicy:
                      type: string
                      enum: [ephemeral, persistent]
                      default: ephemeral
                    env:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: { type: string }
                          value: { type: string }
                          secretRef:
                            type: object
                            properties: { secretName: { type: string }, key: { type: string } }
                    cli:
                      type: object
                      properties:
                        promptFlag: { type: string }
                        workingDir: { type: string }
                        maxOutputBytes: { type: integer }
                        passthroughEnv:
                          type: array
                          items: { type: string }
                    http:
                      type: object
                      properties:
                        url: { type: string }
                        method: { type: string }
                        headers:
                          type: object
                          additionalProperties: { type: string }
                        promptField: { type: string }
                        responseField: { type: string }
                        auth:
                          type: object
                          properties: { secretName: { type: string } }
                        retry:
                          type: object
                          properties:
                            maxAttempts: { type: integer }
                            backoffBaseMs: { type: integer }
                            maxBackoffMs: { type: integer }
                        imagePolicy:
                          type: object
                          properties:
                            allowURLs: { type: boolean }
                            allowedURLHosts:
                              type: array
                              items: { type: string }
                storage:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: ["", agentfs]
                    agentfs:
                      type: object
                      properties:
                        sizeGiB: { type: integer, minimum: 1 }
                        mountPath: { type: string }
                        image: { type: string }
                        backend: { type: string, enum: ["", tar, kopia] }
                        backup:
                          type: object
                          properties:
                            schedule: { type: string }
                            walSnapshotInterval: { type: string }
                            retention:
                              type: object
                              properties:
                                maxVersions: { type: integer, minimum: 1 }
                                minAge: { type: string }
                            s3:
                              type: object
                              required: [bucket]
                              properties:
                                bucket: { type: string }
                                prefix: { type: string }
                                region: { type: string }
                                endpointURL: { type: string }
                                sseAlgorithm:
                                  type: string
                                  enum: [AES256, "aws:kms", ""]
                                kmsKeyARN: { type: string }
                                versioning: { type: boolean }
                                credentialsRef:
                                  type: object
                                  properties: { secretName: { type: string }, key: { type: string } }
                        restore:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum: [latest, versionID, pointInTime]
                            versionID: { type: string }
                            pointInTime: { type: string }
                            ifMissing:
                              type: string
                              enum: [fresh, fail]
                instructions: { type: string, minLength: 1 }
                tools:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      namespace: { type: string }
                memory:
                  type: object
                  properties:
                    name: { type: string }
                budget:
                  type: object
                  required: [maxSteps, maxTokens, maxWallClockSeconds, maxToolCalls]
                  properties:
                    maxSteps: { type: integer, minimum: 1 }
                    maxTokens: { type: integer, minimum: 1 }
                    maxWallClockSeconds: { type: integer, minimum: 1 }
                    maxToolCalls: { type: integer, minimum: 0 }
                identity:
                  type: object
                  properties:
                    spiffeIDPrefix: { type: string }
                sandbox:
                  type: object
                  properties:
                    runtimeClass: { type: string }
                gracefulCancelTimeoutSeconds: { type: integer }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer }
                resolvedTools:
                  type: array
                  items: { type: string }
                resolvedProvider: { type: string }
                reason: { type: string }
                message: { type: string }
