spec:
  group: runtime.agents.smol-agents.ai
  names:
    kind: AgentRunQuota
    listKind: AgentRunQuotaList
    plural: agentrunquotas
    shortNames:
    - arq
    singular: agentrunquota
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.maxConcurrentRuns
      name: Max
      type: integer
    - jsonPath: .status.activeRuns
      name: Active
      type: integer
    - jsonPath: .status.queuedRuns
      name: Queued
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRunQuota is the K8s-native wrapper around the pure AgentRunQuotaSpec —
          the per-namespace concurrency cap the run reconciler enforces (D10).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              maxConcurrentRuns:
                description: |-
                  MaxConcurrentRuns is the namespace-wide cap on simultaneously-Running
                  AgentRuns. 0 = unlimited (falls back to the operator default).
                format: int32
                minimum: 0
                type: integer
              maxPriority:
