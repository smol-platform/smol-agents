apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsessions.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: AgentSession
    plural: agentsessions
    singular: agentsession
    shortNames: [asess]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Agent, type: string, jsonPath: .spec.agentRef }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [agentRef]
              properties:
                agentRef: { type: string, minLength: 1 }
                idleTimeoutSeconds: { type: integer, minimum: 0 }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer }
                runs:
                  type: array
                  items: { type: string }
