apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelproviders.runtime.agents.smol-agents.ai
spec:
  group: runtime.agents.smol-agents.ai
  scope: Namespaced
  names:
    kind: ModelProvider
    plural: modelproviders
    singular: modelprovider
    shortNames: [mp]
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            ModelProvider supplies the credentials and endpoint defaults for an
            LLM provider family, referenced by Agent.spec.model.providerRef. The
            API key is brokered at runtime and never embedded in the pod spec.
          required: [spec]
          properties:
            spec:
              type: object
              description: ModelProviderSpec configures one LLM provider.
              required: [kind, secretRef]
              properties:
                kind:
                  type: string
                  description: |-
                    LLM provider family: openai | anthropic | bedrock | vertex |
                    local. Only openai-compatible (and local) have a working
                    loop-mode client today (pkg/agentruntime/openaillm);
                    bedrock/vertex are reserved (no client). Drives credential
                    brokering + endpoint defaults.
                  enum: [openai, anthropic, bedrock, vertex, local]
                endpoint: { type: string, description: 'Override the kind default base URL; required for local.' }
                secretRef:
                  type: object
                  description: Reference to the Secret holding the provider API key.
                  required: [secretName]
                  properties:
                    secretName: { type: string, description: 'Secret holding the API key; leased by the broker at runtime, never embedded in the pod spec.' }
                    key: { type: string, description: 'Key within the Secret holding the API key (rv4.2). When empty and the Secret has exactly one key, that key is used.' }
