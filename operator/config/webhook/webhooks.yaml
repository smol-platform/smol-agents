---
apiVersion: v1
kind: Service
metadata:
  name: smol-agents-operator-webhook
  namespace: smol-agents-system
  labels:
    app.kubernetes.io/name: smol-agents-operator
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/name: smol-agents-operator
    app.kubernetes.io/component: manager
  ports:
    - name: https
      port: 443
      targetPort: 9443
      protocol: TCP
---
# CA bundle is filled in by cert-manager (or a custom issuer) at install
# time via the cert-manager.io/inject-ca-from annotation. For self-managed
# installs replace ${CA_BUNDLE} with your CA before applying.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: smol-agents-operator-validating
  annotations:
    cert-manager.io/inject-ca-from: smol-agents-system/smol-agents-operator-serving-cert
webhooks:
  - name: validate.smolagent.agents.stigen.ai
    sideEffects: None
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    clientConfig:
      service:
        name: smol-agents-operator-webhook
        namespace: smol-agents-system
        path: /validate-agents-stigen-ai-v1-smolagent
    rules:
      - apiGroups: [agents.stigen.ai]
        apiVersions: [v1]
        resources: [smolagents]
        operations: [CREATE, UPDATE]
  - name: validate.smolagentplatform.agents.stigen.ai
    sideEffects: None
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    clientConfig:
      service:
        name: smol-agents-operator-webhook
        namespace: smol-agents-system
        path: /validate-agents-stigen-ai-v1-smolagentplatform
    rules:
      - apiGroups: [agents.stigen.ai]
        apiVersions: [v1]
        resources: [smolagentplatforms]
        operations: [CREATE, UPDATE]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: smol-agents-operator-mutating
  annotations:
    cert-manager.io/inject-ca-from: smol-agents-system/smol-agents-operator-serving-cert
webhooks:
  - name: default.smolagent.agents.stigen.ai
    sideEffects: None
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    clientConfig:
      service:
        name: smol-agents-operator-webhook
        namespace: smol-agents-system
        path: /mutate-agents-stigen-ai-v1-smolagent
    rules:
      - apiGroups: [agents.stigen.ai]
        apiVersions: [v1]
        resources: [smolagents]
        operations: [CREATE, UPDATE]
---
# AgentNetwork validating webhook — enforces the transport-mutex
# at admission time. Same rules as ValidateAgentNetwork() in
# pkg/agentmodel/v1; the reconciler also runs them at Reconcile,
# but the webhook makes failures surface in `kubectl apply` rather
# than as Status.Phase=Failed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: smol-agents-operator-validating-agentnetwork
  annotations:
    cert-manager.io/inject-ca-from: smol-agents-system/smol-agents-operator-serving-cert
webhooks:
  - name: validate.agentnetwork.runtime.agents.stigen.ai
    sideEffects: None
    admissionReviewVersions: [v1]
    failurePolicy: Fail
    clientConfig:
      service:
        name: smol-agents-operator-webhook
        namespace: smol-agents-system
        path: /validate-runtime-agents-stigen-ai-v1-agentnetwork
    rules:
      - apiGroups: [runtime.agents.stigen.ai]
        apiVersions: [v1]
        resources: [agentnetworks]
        operations: [CREATE, UPDATE]
