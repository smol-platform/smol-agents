# Self-signed Issuer + Certificate that backs the operator's webhook
# TLS. The `cert-manager.io/inject-ca-from` annotation on the
# ValidatingWebhookConfiguration tells cert-manager-cainjector to
# stamp this CA into each webhook's caBundle.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: smol-agents-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smol-agents-operator-serving-cert
  namespace: smol-agents-system
spec:
  secretName: smol-agents-operator-serving-cert
  duration: 24h
  renewBefore: 6h
  issuerRef:
    name: selfsigned
    kind: Issuer
  dnsNames:
    - smol-agents-operator-webhook.smol-agents-system.svc
    - smol-agents-operator-webhook.smol-agents-system.svc.cluster.local
