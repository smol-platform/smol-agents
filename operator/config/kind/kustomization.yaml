# Kind-cluster overlay: same control-plane bits, but no webhook (kind
# tests run without cert-manager) and the deployment is patched to set
# ENABLE_WEBHOOKS=false so the manager doesn't try to bind 9443.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smol-agents-system
resources:
  - ../crd
  - ../rbac
  - ../manager
patches:
  - target:
      kind: Deployment
      name: smol-agents-operator
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ENABLE_WEBHOOKS
            value: "false"
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --leader-elect=false
          - --metrics-bind-address=:8443
          - --health-probe-bind-address=:8081
          # kind can't run kata microVMs, so this dev/CI overlay uses the
          # operator's documented runc escape hatch (resolveSandbox: "runc +
          # allowHostRuntime → deliberately permitted (dev/CI cluster)"). Lets
          # the operator-path AgentRun schedule a pod on kind for e2e; prod
          # overlays keep the kata-fc default + allowHostRuntime=false.
          - --default-run-runtime-class=runc
          - --allow-host-runtime=true
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: smol-agents-operator
