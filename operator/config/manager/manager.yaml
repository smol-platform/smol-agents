apiVersion: v1
kind: Namespace
metadata:
  name: knative-agents-system
  labels:
    # The operator pod itself is restricted-compliant, but the
    # ebpf-loader DaemonSet it owns runs privileged (R-EBP). We keep
    # this namespace at "privileged" so the DS Pod admits; the
    # operator and webhook Pods enforce restricted via their own
    # SecurityContexts.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knative-agents-operator
  namespace: knative-agents-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knative-agents-operator
  namespace: knative-agents-system
  labels:
    app.kubernetes.io/name: knative-agents-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-agents-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knative-agents-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: knative-agents-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: knative-agents/operator:0.1.0
          args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8443
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
