# Generated by hand to mirror the verbs the controllers actually call.
# Implements R-OP-SEC-1: no `*` verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smol-agents-operator
rules:
  # CR access — control-plane CRs.
  - apiGroups: [agents.smol-agents.ai]
    resources: [agentnodepools]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [agents.smol-agents.ai]
    resources: [agentnodepools/status]
    verbs: [get, update, patch]
  - apiGroups: [agents.smol-agents.ai]
    resources: [agentnodepools/finalizers]
    verbs: [update]

  # Karpenter objects owned by AgentNodePool (node provisioning).
  - apiGroups: [karpenter.sh]
    resources: [nodepools]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch, create, update, patch, delete]

  # CR access — runtime CRs (Agent, AgentRun, AgentNetwork, Memory*, etc).
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [agents, tools, modelproviders, agentruns, agentsessions, agentteams, agentworkflows, agentpolicies, agentrunquotas, agentnetworks, dynamiccredentialbackends, modelgateways, memorystores, memoryretrievers]
    verbs: [get, list, watch, update, patch]
  # A2A (M3.6): the operator grants each kind=agent Agent a Role allowing its run
  # pods to CREATE child AgentRuns. k8s privilege-escalation prevention requires
  # the granting SA to itself hold every verb it grants — so the operator needs
  # create on agentruns (it never creates runs itself; this only satisfies the
  # escalation check for ensureA2ARBAC).
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources: [agentruns]
    verbs: [create]
  - apiGroups: [runtime.agents.smol-agents.ai]
    resources:
      - agents/status
      - agentruns/status
      - agentsessions/status
      - agentteams/status
      - agentworkflows/status
      - agentpolicies/status
      - agentrunquotas/status
      - agentnetworks/status
      - dynamiccredentialbackends/status
      - modelproviders/status
      - modelgateways/status
      - memoryretrievers/status
    verbs: [get, update, patch]

  # AgentRun reconciler creates Pods for each run.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]

  # AgentNetwork/DynamicCredentialBackend resolve referenced secrets by NAME
  # ONLY to fail fast (there is no SecretList anywhere in the operator);
  # AgentRun generates a per-run broker config Secret (static backend +
  # policy). knative-agents-5jy: `list`/`watch` were dropped — the manager
  # deliberately does NOT cache/watch Secrets cluster-wide (see
  # client.Options.Cache.DisableFor in operator/cmd/manager/main.go), so do
  # not add list/watch back "to make Get() fast" — that would silently
  # re-open a cluster-wide Secret informer that reads every Secret in the
  # cluster into operator memory.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]

  # Identity feature
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [spire.spiffe.io]
    resources: [clusterspiffeids]
    verbs: [get, list, watch, create, update, patch, delete]

  # Sandbox feature
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch, create, update, patch, delete]

  # AgentRun egress cage: per-run default-deny NetworkPolicy.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]

  # M1.18: discover kube-apiserver endpoints to allow them through the egress
  # floor (apiserver at <node-ip>:6443 on public-IP clusters).
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]

  # Workload feature (Deployment, StatefulSet, Knative Service)
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Memory subsystem owns core Services for the worker + mcp Deployments.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]

  # The operator creates only NAMESPACED RBAC: the per-Agent A2A Role +
  # RoleBinding (M3.6, ensureA2ARBAC in agent_controller.go). The manager
  # already holds agentruns verbs (above), so granting an A2A Role that
  # carries the same verbs is not privilege escalation.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # knative-agents-5jy: cluster-scoped RBAC is READ-ONLY. `create`/`update`/
  # `patch`/`delete` on clusterrolebindings is a privilege-escalation
  # primitive — it would let a compromised operator bind any ClusterRole
  # (including cluster-admin) to any subject. Nothing in the operator
  # constructs a ClusterRole/ClusterRoleBinding (the only prior source, the
  # eBPF loader's RBAC builder, was deleted); any cluster-scoped RBAC an
  # installation needs is provisioned statically at install time from
  # operator/config/rbac, not created at runtime.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch]

  # Events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smol-agents-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smol-agents-operator
subjects:
  - kind: ServiceAccount
    name: smol-agents-operator
    namespace: smol-agents-system
