# Generated by hand to mirror the verbs the controllers actually call.
# Implements R-OP-SEC-1: no `*` verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smol-agents-operator
rules:
  # CR access — control-plane CRs.
  - apiGroups: [agents.stigen.ai]
    resources: [smolagents, smolagentplatforms, agentnodepools]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [agents.stigen.ai]
    resources: [smolagents/status, smolagentplatforms/status, agentnodepools/status]
    verbs: [get, update, patch]
  - apiGroups: [agents.stigen.ai]
    resources: [smolagents/finalizers, smolagentplatforms/finalizers, agentnodepools/finalizers]
    verbs: [update]

  # Karpenter objects owned by AgentNodePool (node provisioning).
  - apiGroups: [karpenter.sh]
    resources: [nodepools]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [karpenter.k8s.aws]
    resources: [ec2nodeclasses]
    verbs: [get, list, watch, create, update, patch, delete]

  # CR access — runtime CRs (Agent, AgentRun, AgentNetwork, Memory*, etc).
  - apiGroups: [runtime.agents.stigen.ai]
    resources: [agents, tools, modelproviders, agentruns, agentsessions, agentpolicies, agentnetworks, memorystores, memoryretrievers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [runtime.agents.stigen.ai]
    resources:
      - agents/status
      - agentruns/status
      - agentsessions/status
      - agentpolicies/status
      - agentnetworks/status
      - memoryretrievers/status
    verbs: [get, update, patch]

  # AgentRun reconciler creates Pods for each run.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]

  # AgentNetwork resolves broker secrets to fail fast.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]

  # Identity feature
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [spire.spiffe.io]
    resources: [clusterspiffeids]
    verbs: [get, list, watch, create, update, patch, delete]

  # Sandbox feature
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch, create, update, patch, delete]

  # Workload feature (Deployment, StatefulSet, Knative Service)
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Memory subsystem owns core Services for the worker + mcp Deployments.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]

  # eBPF loader RBAC subjects
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]

  # Events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smol-agents-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: smol-agents-operator
subjects:
  - kind: ServiceAccount
    name: smol-agents-operator
    namespace: smol-agents-system
