# fake-llm Deployment + Service for the L1 e2e ring.
# In-cluster scenarios dial http://fake-llm.tenant-a.svc.cluster.local:8080.
# The image is built locally + kind-loaded as knative-agents/fake-llm:dev.
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: fake-llm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-llm
    spec:
      containers:
        - name: fake-llm
          image: knative-agents/fake-llm:dev
          imagePullPolicy: Never
          args: ["-addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
