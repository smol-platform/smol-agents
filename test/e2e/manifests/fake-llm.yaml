# fake-llm Deployment + Service for the L1 e2e ring.
# In-cluster scenarios dial http://fake-llm.tenant-a.svc.cluster.local:8080.
# Plans mounted via ConfigMap so S-AGENTRUN exercises the real
# plan→tool→observation cycle (not just the fallback FinalAnswer).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-llm-plans
  namespace: tenant-a
data:
  plans.json: |
    {
      "globalSequence": [
        {"toolCall": {"tool": "echo", "arguments": {"text": "hello"}},
         "tokensIn": 10, "tokensOut": 5},
        {"finalAnswer": {"output": {"echoed": "hello"}},
         "tokensIn": 12, "tokensOut": 8}
      ],
      "fallback": {"finalAnswer": {"output": {"answer": "done"}}}
    }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: fake-llm
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: fake-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-llm
    spec:
      containers:
        - name: fake-llm
          image: knative-agents/fake-llm:dev
          imagePullPolicy: Never
          args: ["-addr=:8080", "-plans=/etc/fake-llm/plans.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: plans
              mountPath: /etc/fake-llm
              readOnly: true
      volumes:
        - name: plans
          configMap:
            name: fake-llm-plans
