# fake-gateway Deployment + Service for L1, running the real
# SVID-aware cmd/fake-gateway binary. Mounts the SPIRE workload-API
# socket so it can fetch its own SVID and validate clients'.
apiVersion: v1
kind: Service
metadata:
  name: fake-gateway
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: fake-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: tcp
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gateway
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: fake-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-gateway
    spec:
      containers:
        - name: fake-gateway
          image: smol-agents/fake-gateway:dev
          imagePullPolicy: Never
          args:
            - "-tcp-addr=:8443"
            - "-http-addr=:8080"
            - "-jwt-audience=spiffe://stigen.ai/ns/tenant-a/sa/fake-gateway"
            - "-authorize-tcp=spiffe://stigen.ai/ns/tenant-a"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: tcp,  containerPort: 8443 }
          # Without a readiness probe the Deployment goes Available
          # before the TCP listener binds, which lets PROXY-TCP race
          # the dial and fail with "connection refused". The 8443
          # socket comes up only after the SPIRE workload-API
          # handshake, so it's the right gate for "really ready".
          readinessProbe:
            tcpSocket: { port: 8443 }
            initialDelaySeconds: 1
            periodSeconds: 1
          volumeMounts:
            - name: sockets
              mountPath: /run/spire/agent-sockets
              readOnly: true
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: sockets
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
