# fake-gateway Deployment + Service for L1.
# This variant skips SPIFFE for now (L1's CapSPIRE is false until
# SPIRE is deployed in cluster); uses plain HTTP+TCP echo so
# scenarios that just need an upstream can hit it.
#
# When SPIRE lands in kind (T-2.x), this manifest gets a SPIRE socket
# mount + the production fake-gateway args.
apiVersion: v1
kind: Service
metadata:
  name: fake-gateway
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: fake-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: tcp
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gateway
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: fake-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-gateway
    spec:
      containers:
        # NOTE: cmd/fake-gateway requires a SPIRE socket — at L1 we
        # don't yet run SPIRE, so we use socat as a temporary stand-in
        # echo. Full fake-gateway (SVID-aware) lights up when T-2.x
        # deploys SPIRE in kind.
        - name: echo
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          command: ["socat", "TCP-LISTEN:8080,fork,reuseaddr", "EXEC:/bin/cat"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
        - name: tcp-echo
          image: alpine/socat:1.8.0.0
          imagePullPolicy: IfNotPresent
          command: ["socat", "TCP-LISTEN:8443,fork,reuseaddr", "EXEC:/bin/cat"]
          ports:
            - name: tcp
              containerPort: 8443
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
