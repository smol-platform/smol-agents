# fake-github Deployment + Service for the secretless-egress scenario. Runs the
# real cmd/fake-github binary: it exposes the GitHub App API the broker calls to
# mint an installation token, plus an agent-facing resource endpoint that only
# accepts a server-minted token. Implements R-E2E-SCN-SECRETLESS (upstream).
apiVersion: v1
kind: Service
metadata:
  name: fake-github
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: fake-github
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-github
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: fake-github
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-github
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-github
    spec:
      containers:
        - name: fake-github
          image: smol-agents/fake-github:dev
          imagePullPolicy: Never
          args:
            - "-addr=:8080"
            - "-app-id=123456"          # must match the broker's GitHubAppBackend.AppID
            - "-installation-id=42"
            - "-token-ttl=1h"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
