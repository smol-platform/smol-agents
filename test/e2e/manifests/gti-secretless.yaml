# Persistent secretless-egress verification stack for the gti k0s cluster.
#
# Proves the secretless chain end-to-end against gti's REAL SPIRE (trust domain
# nixfleet.stigen.ai, SVIDs via spire-controller-manager + the csi.spiffe.io
# workload-API socket): the spiffe-probe runs an in-process broker
# (SO_PEERCRED attestation → GitHubAppBackend → fake-github, JWKS → fake-tts,
# deny-by-default policy) + a real agentnet proxy that mints a TraT, mints a
# GitHub token via the broker, and injects it — agent-blind.
#
# Images are imported into k0s containerd as docker.io/smol-agents/*:dev
# (imagePullPolicy: Never). Re-run the probe immediately with:
#   k0s kubectl -n secretless-test create job sl-now --from=cronjob/secretless-probe
#   k0s kubectl -n secretless-test logs job/sl-now
---
apiVersion: v1
kind: Namespace
metadata:
  name: secretless-test
  labels:
    kubernetes.io/metadata.name: secretless-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secretless-probe
  namespace: secretless-test
---
# Issues an SVID to the probe pod: spiffe://nixfleet.stigen.ai/ns/secretless-test/sa/secretless-probe
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: secretless-test
spec:
  spiffeIDTemplate: "spiffe://nixfleet.stigen.ai/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: secretless-test
  podSelector:
    matchLabels:
      app: secretless-probe
  ttl: 1h
  jwtTtl: 10m
---
apiVersion: v1
kind: Service
metadata:
  name: fake-tts
  namespace: secretless-test
spec:
  selector: { app.kubernetes.io/name: fake-tts }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-tts
  namespace: secretless-test
  labels: { app.kubernetes.io/name: fake-tts }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fake-tts } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-tts }
    spec:
      containers:
        - name: fake-tts
          image: docker.io/smol-agents/fake-tts:dev
          imagePullPolicy: Never
          args: ["-addr=:8080", "-repo=stigen/app", "-ttl=5m"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: fake-github
  namespace: secretless-test
spec:
  selector: { app.kubernetes.io/name: fake-github }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-github
  namespace: secretless-test
  labels: { app.kubernetes.io/name: fake-github }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fake-github } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-github }
    spec:
      containers:
        - name: fake-github
          image: docker.io/smol-agents/fake-github:dev
          imagePullPolicy: Never
          args: ["-addr=:8080", "-app-id=123456", "-installation-id=42", "-token-ttl=1h"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
# Hourly verification. Manually trigger anytime with `create job --from=cronjob/...`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secretless-probe
  namespace: secretless-test
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: { app: secretless-probe }
        spec:
          serviceAccountName: secretless-probe
          restartPolicy: Never
          containers:
            - name: probe
              image: docker.io/smol-agents/spiffe-probe:dev
              imagePullPolicy: Never
              args:
                - "--scenarios=secretless"
                - "--socket=unix:///spiffe-workload-api/agent.sock"
                - "--github-url=http://fake-github.secretless-test.svc.cluster.local:8080"
                - "--tts-url=http://fake-tts.secretless-test.svc.cluster.local:8080"
              volumeMounts:
                - { name: wapi, mountPath: /spiffe-workload-api, readOnly: true }
          volumes:
            - name: wapi
              csi: { driver: csi.spiffe.io, readOnly: true }
