# wg-hub: in-cluster WireGuard server for the L2 WG-CLIENT scenario.
#
# The test driver runs outside the cluster (uses the netstack-backed
# userspace WireGuard adapter under -tags=wgnetstack) and handshakes
# with this pod via a NodePort UDP service. Keys come from
# pkg/agentnet/wireguard/testkeys.go — TEST-ONLY, no real secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-hub-config
  namespace: tenant-a
data:
  wg0.conf: |
    [Interface]
    Address = 10.99.0.1/24
    ListenPort = 51820
    PrivateKey = 2LyfcbUQjZ8vpJZs5Est4eNTW22GDe1lf/cqpLo7F2A=

    [Peer]
    # test-driver
    PublicKey = 3KJpkmMoN1EB3NQux7w8X37BGNX6suNOWd1geYjKwU4=
    AllowedIPs = 10.99.0.5/32
---
apiVersion: v1
kind: Service
metadata:
  name: wg-hub
  namespace: tenant-a
spec:
  selector:
    app.kubernetes.io/name: wg-hub
  ports:
    - name: wg
      protocol: UDP
      port: 51820
      targetPort: 51820
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-hub
  namespace: tenant-a
  labels:
    app.kubernetes.io/name: wg-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-hub
    spec:
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add: [NET_ADMIN, SYS_MODULE]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ,   value: "UTC" }
          ports:
            - name: wg
              protocol: UDP
              containerPort: 51820
          volumeMounts:
            - { name: cfg,  mountPath: /config/wg_confs/wg0.conf, subPath: wg0.conf, readOnly: true }
            - { name: modules, mountPath: /lib/modules, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "ip link show wg0 >/dev/null 2>&1"]
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: cfg
          configMap:
            name: wg-hub-config
        - name: modules
          hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
