# GitLab CI — build + push the core multiarch (linux/amd64 + linux/arm64) images
# to this project's GitLab Container Registry. Mirrors
# .github/workflows/release-images.yaml (the canonical image-release pipeline);
# tests/CI continue to run on GitHub Actions.
#
# Pushes to $CI_REGISTRY_IMAGE/<image>:<tag> using the built-in CI_JOB_TOKEN, so
# no external registry credentials are configured here. A cluster pulls these
# with a project deploy token (Settings > Repository > Deploy tokens, scope
# read_registry) wired as an imagePullSecret.
#
# Runs on:
#   - a version tag vX.Y.Z  -> publishes tag X.Y.Z (leading "v" stripped)
#   - a manual web/API run  -> publishes $IMAGE_TAG (default: the short commit SHA;
#                              set IMAGE_TAG as a pipeline variable to override)
# It does NOT run on ordinary branch pushes (building 11 multiarch images per
# push is wasteful) — trigger it explicitly when you need images.
#
# Runner requirement: a PRIVILEGED runner with the docker:dind service, because
# multiarch buildx registers QEMU emulators via binfmt (needs --privileged).

stages:
  - images

build-images:
  stage: images
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    PLATFORMS: "linux/amd64,linux/arm64"
    # Default tag for a manual run; a vX.Y.Z tag pipeline overrides it below.
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  parallel:
    matrix:
      - IMAGE:
          - operator
          - agent
          - agentfs-sidecar
          - secret-proxy
          - ebpf-loader
          - agentctl
          - agentgateway
          - harness-claude-code
          - harness-codex
          - harness-aider
          - harness-goose
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'   # version tag: publish
    - if: '$CI_PIPELINE_SOURCE == "web"'                   # manual run from the UI
    - if: '$CI_PIPELINE_SOURCE == "api"'                   # manual run via API
  before_script:
    # A vX.Y.Z tag publishes X.Y.Z; otherwise keep IMAGE_TAG (short SHA / override).
    - if [ -n "$CI_COMMIT_TAG" ]; then IMAGE_TAG="${CI_COMMIT_TAG#v}"; fi
    - echo "Building $IMAGE -> $CI_REGISTRY_IMAGE/$IMAGE:$IMAGE_TAG ($PLATFORMS)"
    # QEMU emulators for cross-arch builds (needs the privileged dind daemon).
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name smolbuilder
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Several images COPY bpf/build/*.bpf.o (agent, ebpf-loader); compile them up
    # front for every job — harmless for images that don't use them, and avoids an
    # allowlist that silently breaks when a new image starts embedding the objects.
    # They are CO-RE bpfel objects and arch-portable, so one build serves both.
    - mkdir -p bpf/build
    - docker buildx build --file deploy/docker/bpf-builder.Dockerfile --target export --output type=local,dest=. .
    - docker buildx build --platform "$PLATFORMS"
        --file "deploy/docker/${IMAGE}.Dockerfile"
        --tag "$CI_REGISTRY_IMAGE/${IMAGE}:${IMAGE_TAG}"
        --push .
