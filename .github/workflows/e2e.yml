# Fullstack e2e workflows (CI).
#
# - e2e-l0: docker-compose ring (~1 min). Runs on every push/PR.
# - e2e-l1: kind-on-Linux ring (~5 min including bring-up). Runs on every push/PR.
#
# L2 (AWS Spot bare-metal + Kata-FC) is NOT wired into CI yet — it needs the
# org's AWS OIDC role + secrets/vars (SMOL_AGENTS_AWS_ACCOUNT_ID, L2_ARTIFACT_BUCKET,
# L2_ECR_REGISTRY; see docs/runbooks/e2e-l2.md). Until those exist, run L2
# manually: `make e2e-l2-smoke` / `make e2e-l2`.
#
# Implements R-E2E-VRF-2 + R-E2E-VRF-4.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build fake images
        run: |
          docker build -f deploy/docker/fake-llm.Dockerfile -t smol-agents/fake-llm:dev .
          docker build -f deploy/docker/fake-gateway.Dockerfile -t smol-agents/fake-gateway:dev .
          docker build -f scripts/e2e/spire/Dockerfile.spire-shell -t smol-agents/spire-shell:dev scripts/e2e/spire
      - name: make e2e-l0
        run: make e2e-l0

  l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: make e2e-l1
        run: make e2e-l1

  coverage-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: enforce R-E2E-* coverage map
        run: go test -count=1 -run=TestCoverageGate ./test/e2e/fullstack/
