name: release-images

# Build + push the core multiarch (linux/amd64 + linux/arm64) images to ghcr
# on a version tag. Tag the repo `vX.Y.Z` (e.g. v0.1.15); the published image
# tag is the version with the leading "v" stripped, giving
# ghcr.io/smol-platform/smol-agents/<name>:X.Y.Z (matches the manual convention).
# Use the manual run (workflow_dispatch) to publish an arbitrary tag.
#
# Auth uses GITHUB_TOKEN (packages: write). These packages were first created by
# a manual `docker push`, so each must grant this repo write access once:
#   ghcr package -> Package settings -> Manage Actions access -> add
#   smol-platform/smol-agents (Write). Otherwise the push 403s. Alternatively
#   set a CR_PAT secret (a PAT with write:packages) and swap it in below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. 0.1.15)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [operator, agent, agentfs-sidecar, secret-proxy, ebpf-loader, agentctl,
                harness-claude-code, harness-codex, harness-aider, harness-goose]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.image_tag }}'
          else
            tag="${GITHUB_REF_NAME#v}"   # v0.1.15 -> 0.1.15
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      # Several images COPY bpf/build/*.bpf.o (agent, ebpf-loader, ebpf-probe),
      # so compile them up front for every job — harmless for images that don't
      # use them, and avoids an allowlist that silently breaks when a new image
      # starts embedding the objects. They're CO-RE bpfel and arch-portable, so
      # one native build serves both platforms.
      - name: Compile BPF objects
        run: |
          mkdir -p bpf/build
          docker buildx build --file deploy/docker/bpf-builder.Dockerfile \
            --target export --output type=local,dest=. .

      - name: Build + push ${{ matrix.image }} (amd64+arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file "deploy/docker/${{ matrix.image }}.Dockerfile" \
            --tag "ghcr.io/smol-platform/smol-agents/${{ matrix.image }}:${IMAGE_TAG}" \
            --push .

      - name: Summary
        run: |
          echo "Pushed ghcr.io/smol-platform/smol-agents/${{ matrix.image }}:${IMAGE_TAG} (linux/amd64,linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
