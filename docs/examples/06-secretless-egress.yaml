# ─────────────────────────────────────────────────────────────────────────────
# Example 06 — Secretless egress to GitHub  (capability built on M1's datapath)
#
#     kubectl apply -f docs/examples/00-prerequisites.yaml
#     kubectl apply -f docs/examples/06-secretless-egress.yaml
#
# The agent calls https://api.github.com but NEVER holds a GitHub token. An
# identity-aware sidecar (selected onto the agent's pods by the AgentNetwork):
#   1. mints an internal Transaction-Token (RFC 8693) via the TTS, scoped to the
#      declared intent (github:repo:read) and audienced at this trust domain;
#   2. hands that TraT to the secret broker, which verifies it (sig, audience,
#      expiry, and that the caller's attested SPIFFE id matches) and mints a
#      short-lived GitHub App installation token for the requested repo;
#   3. injects it as `Authorization: Bearer <token>` on the way out.
# eBPF drops any egress not on the allow-list, so the credential cannot be
# exfiltrated to another host — and the agent code is credential-blind.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: runtime.agents.smol-agents.ai/v1
kind: AgentNetwork
metadata:
  name: github-secretless
  namespace: tenant-a
spec:
  kind: identityProxy
  agentSelector:
    app.kubernetes.io/name: smol-agents   # binds to this tenant's agent run pods
  identityProxy:
    tts:                                   # mints/verifies the Transaction Tokens
      url: https://tts.security.svc/token
      subjectTokenType: urn:ietf:params:oauth:token-type:jwt
      subjectAudience: spiffe://smol-agents.ai/ns/security/sa/tts
      jwksUrl: https://tts.security.svc/jwks
    resources:
      - name: github
        kind: http
        localPort: 9200                    # the sidecar listens here, in-pod
        gateway: https://api.github.com/
        jwtAudience: spiffe://smol-agents.ai/ns/tenant-a/sa/agent
        credential:
          name: github                     # broker credential/policy key
          scope: github:repo:read          # the authorizing TraT's transaction intent
          header: Authorization            # (defaults shown for clarity)
          scheme: Bearer
    egress:
      enforcement: ebpfBoth                # cgroup/connect4 redirect + egress drop
      redirectCIDRs: [0.0.0.0/0]
      allow:
        - cidr: 140.82.112.0/20            # api.github.com — everything else dropped
          protocol: tcp
          ports: [443]
---
# The Tool the agent calls points at the LOCAL sidecar port, not GitHub directly
# — the sidecar is what attaches the (broker-minted) credential.
apiVersion: runtime.agents.smol-agents.ai/v1
kind: Tool
metadata:
  name: github-list-issues
  namespace: tenant-a
spec:
  kind: http
  description: "List open issues for a repo (credential injected by the sidecar)."
  http:
    url: http://127.0.0.1:9200/repos/smol-platform/smol-agents/issues
    method: GET
    # no auth.secretName — the agent holds NO credential; the sidecar adds it.
  inputSchema: { type: object }
  outputSchema: { type: object }
---
apiVersion: runtime.agents.smol-agents.ai/v1
kind: Agent
metadata:
  name: triage-bot
  namespace: tenant-a
spec:
  model: { providerRef: openai, name: gpt-4o }
  instructions: "List the open issues and group them by area."
  tools:
    - name: github-list-issues
  budget:
    maxSteps: 6
    maxTokens: 30000
    maxWallClockSeconds: 120
    maxToolCalls: 4
---
apiVersion: runtime.agents.smol-agents.ai/v1
kind: AgentRun
metadata:
  name: triage-001
  namespace: tenant-a
spec:
  agentRef: triage-bot
  input: { repo: "smol-platform/smol-agents" }
